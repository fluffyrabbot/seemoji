name: Compatibility matrix

# Intentionally dormant: run before a release or after changing framework,
# rendering, browser adapters, clipboard behavior, or responsive layout.
on:
  workflow_dispatch:

jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run check:compat
