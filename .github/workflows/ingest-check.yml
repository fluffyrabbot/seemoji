name: Emoji pack ingest check

on:
  pull_request:
    paths:
      - 'scripts/ingest/**'
      - 'public/packs/**'
      - '.github/workflows/ingest-check.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: node scripts/ingest/twemoji.mjs --check
      - run: node scripts/ingest/noto.mjs --check
      - run: node scripts/ingest/fluent.mjs --check
      - run: node scripts/ingest/openmoji.mjs --check
      - run: node scripts/ingest/fxemoji.mjs --check
      - run: node scripts/ingest/emojitwo.mjs --check
      - run: node scripts/ingest/blobmoji.mjs --check
      - run: node scripts/ingest/serenity.mjs --check
      - run: node scripts/ingest/index.mjs --check
