name: Deploy Pages

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - name: Require Cloudflare deployment credentials
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || {
            echo 'Missing production environment secret: CLOUDFLARE_ACCOUNT_ID'
            exit 1
          }
          test -n "$CLOUDFLARE_API_TOKEN" || {
            echo 'Missing production environment secret: CLOUDFLARE_API_TOKEN'
            exit 1
          }
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - name: Deploy verified production artifact
        run: >-
          npm exec wrangler -- pages deploy
          --branch=main
          --commit-hash="$GITHUB_SHA"
